<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | SIH 2026 Team Portal</title>
  <meta name="description" content="Reset your SIH 2026 portal password via OTP sent to your team leader's email." />
  <link rel="icon" href="assets/united-logo.png" type="image/png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{primary:{DEFAULT:'#1a73e8',dark:'#1557b0',light:'#e8f0fe'},united:{DEFAULT:'#2A4B8D'}}}}}</script>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    body{font-family:'Inter',sans-serif;}
    .card{box-shadow:0 20px 60px -10px rgba(26,115,232,0.12),0 4px 20px -4px rgba(0,0,0,0.08);}
    .input-field:focus{outline:none;box-shadow:0 0 0 3px rgba(26,115,232,0.15);}
    .btn-primary{background:linear-gradient(135deg,#1a73e8,#1557b0);}
    .btn-primary:hover{background:linear-gradient(135deg,#1557b0,#0d3b8e);transform:translateY(-1px);box-shadow:0 6px 20px rgba(26,115,232,0.35);}
    @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    .fade-up{animation:fadeUp 0.5s ease forwards;}
    .otp-input{letter-spacing:0.35em;font-size:1.5rem;font-weight:900;text-align:center;}
    .step{display:none;}.step.active{display:block;}
  </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-blue-50/40 to-indigo-50/30 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="site-header bg-white/95 backdrop-blur-md border-b border-gray-200/80 sticky top-0 z-50 shadow-sm">
    <div class="header-inner w-full max-w-full px-4 sm:px-8 py-2 sm:py-2.5 flex items-center justify-between gap-2">
      <a href="index.html" class="flex items-center gap-2 flex-shrink-0">
        <img class="w-9 h-9 sm:w-11 sm:h-11 object-contain" src="assets/united-logo.png" alt="UIT Logo"/>
        <div class="flex flex-col">
          <div class="flex items-center gap-1.5">
            <span class="text-xs sm:text-base font-black text-[#2A4B8D]">UIT Prayagraj</span>
            <span class="text-[9px] font-extrabold text-blue-700 bg-blue-50 border border-blue-200/80 px-1.5 py-0.5 rounded-full">SIH 2026</span>
          </div>
          <span class="text-[10px] font-semibold text-slate-500 hidden sm:block">Team Portal</span>
        </div>
      </a>
      <a href="portal.html" class="text-xs font-semibold text-slate-600 hover:text-blue-700 px-3 py-1.5">← Back to Login</a>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center px-4 py-10 sm:py-16">
    <div class="w-full max-w-md fade-up">

      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-amber-500 rounded-2xl shadow-lg mb-4">
          <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
        </div>
        <h1 class="text-2xl sm:text-3xl font-black text-slate-900">Reset Password</h1>
        <p class="text-sm text-slate-500 mt-1 font-medium">We'll send an OTP to your team leader's email</p>
      </div>

      <!-- Stepper -->
      <div class="flex items-center justify-center gap-2 mb-6">
        <div id="step-dot-1" class="w-8 h-8 rounded-full bg-blue-600 text-white text-xs font-black flex items-center justify-center transition-all">1</div>
        <div class="h-0.5 w-12 bg-slate-200" id="step-line"></div>
        <div id="step-dot-2" class="w-8 h-8 rounded-full bg-slate-200 text-slate-500 text-xs font-black flex items-center justify-center transition-all">2</div>
        <div class="h-0.5 w-12 bg-slate-200"></div>
        <div id="step-dot-3" class="w-8 h-8 rounded-full bg-slate-200 text-slate-500 text-xs font-black flex items-center justify-center transition-all">3</div>
      </div>

      <div class="card bg-white border border-slate-200/80 rounded-2xl p-6 sm:p-8">

        <!-- Error -->
        <div id="error-box" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-700 text-xs font-semibold rounded-xl">
          <span id="error-msg"></span>
        </div>
        <div id="success-box" class="hidden mb-4 p-3 bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-semibold rounded-xl">
          <span id="success-msg"></span>
        </div>

        <!-- STEP 1: Enter Reg ID -->
        <div id="step-1" class="step active">
          <h2 class="text-sm font-bold text-slate-700 mb-4">Step 1 — Enter your Registration ID</h2>
          <div class="mb-5">
            <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wide">Registration ID</label>
            <input id="forgot-regid" type="text" placeholder="SIH2026-XXXX"
              class="input-field w-full px-4 py-3 text-sm font-semibold border border-slate-200 rounded-xl bg-slate-50 focus:bg-white text-slate-900 placeholder-slate-400 transition-all" />
          </div>
          <button id="btn-send-otp" class="btn-primary w-full py-3.5 rounded-xl text-white font-black text-sm transition-all flex items-center justify-center gap-2">
            <span id="send-otp-text">Send OTP to Leader's Email</span>
            <svg id="send-otp-spin" class="hidden w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
          </button>
        </div>

        <!-- STEP 2: Enter OTP -->
        <div id="step-2" class="step">
          <h2 class="text-sm font-bold text-slate-700 mb-1">Step 2 — Enter the OTP</h2>
          <p id="otp-hint" class="text-xs text-slate-500 mb-4">Check your team leader's inbox.</p>
          <div class="mb-5">
            <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wide">6-Digit OTP</label>
            <input id="otp-input" type="text" inputmode="numeric" maxlength="6" placeholder="• • • • • •"
              class="input-field otp-input w-full px-4 py-4 border border-slate-200 rounded-xl bg-slate-50 focus:bg-white text-slate-900 transition-all" />
          </div>
          <button id="btn-verify-otp" class="btn-primary w-full py-3.5 rounded-xl text-white font-black text-sm transition-all flex items-center justify-center gap-2">
            <span id="verify-otp-text">Verify OTP</span>
            <svg id="verify-otp-spin" class="hidden w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
          </button>
          <button class="w-full mt-3 text-xs text-slate-500 hover:text-blue-700 font-semibold" onclick="goStep(1)">← Change Registration ID</button>
        </div>

        <!-- STEP 3: Set New Password -->
        <div id="step-3" class="step">
          <h2 class="text-sm font-bold text-slate-700 mb-4">Step 3 — Set New Password</h2>
          <div class="mb-4">
            <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wide">New Password</label>
            <div class="relative">
              <input id="new-pwd" type="password" placeholder="Min. 6 characters"
                class="input-field w-full pl-4 pr-12 py-3 text-sm font-semibold border border-slate-200 rounded-xl bg-slate-50 focus:bg-white text-slate-900 transition-all" />
              <button type="button" onclick="togglePwd('new-pwd','eye1')" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 text-sm" id="eye1">👁️</button>
            </div>
          </div>
          <div class="mb-6">
            <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wide">Confirm Password</label>
            <div class="relative">
              <input id="confirm-pwd" type="password" placeholder="Re-enter password"
                class="input-field w-full pl-4 pr-12 py-3 text-sm font-semibold border border-slate-200 rounded-xl bg-slate-50 focus:bg-white text-slate-900 transition-all" />
              <button type="button" onclick="togglePwd('confirm-pwd','eye2')" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 text-sm" id="eye2">👁️</button>
            </div>
          </div>
          <button id="btn-reset-pwd" class="btn-primary w-full py-3.5 rounded-xl text-white font-black text-sm transition-all flex items-center justify-center gap-2">
            <span id="reset-pwd-text">Reset Password</span>
            <svg id="reset-pwd-spin" class="hidden w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
          </button>
        </div>

      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/portal-api.js"></script>
  <script src="js/portal-auth.js"></script>
  <script>
    let currentRegId = '';
    let verifiedOtp  = '';

    function showError(msg){ document.getElementById('error-box').classList.remove('hidden'); document.getElementById('error-msg').textContent=msg; document.getElementById('success-box').classList.add('hidden'); }
    function showSuccess(msg){ document.getElementById('success-box').classList.remove('hidden'); document.getElementById('success-msg').textContent=msg; document.getElementById('error-box').classList.add('hidden'); }
    function hideAlerts(){ document.getElementById('error-box').classList.add('hidden'); document.getElementById('success-box').classList.add('hidden'); }
    function togglePwd(id, eyeId){ const el=document.getElementById(id); el.type=el.type==='password'?'text':'password'; document.getElementById(eyeId).textContent=el.type==='password'?'👁️':'🙈'; }

    function goStep(n){
      hideAlerts();
      document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));
      document.getElementById('step-'+n).classList.add('active');
      [1,2,3].forEach(i=>{
        const dot=document.getElementById('step-dot-'+i);
        if(i<n){dot.className='w-8 h-8 rounded-full bg-emerald-500 text-white text-xs font-black flex items-center justify-center transition-all';dot.textContent='✓';}
        else if(i===n){dot.className='w-8 h-8 rounded-full bg-blue-600 text-white text-xs font-black flex items-center justify-center transition-all';dot.textContent=i;}
        else{dot.className='w-8 h-8 rounded-full bg-slate-200 text-slate-500 text-xs font-black flex items-center justify-center transition-all';dot.textContent=i;}
      });
    }

    document.getElementById('btn-send-otp').addEventListener('click', async()=>{
      const regId = document.getElementById('forgot-regid').value.trim();
      if(!regId){ showError('Please enter your Registration ID.'); return; }
      hideAlerts();
      document.getElementById('send-otp-text').textContent='Sending...';
      document.getElementById('send-otp-spin').classList.remove('hidden');
      document.getElementById('btn-send-otp').disabled=true;
      try{
        const res = await PortalApi.forgotOTP(regId);
        if(res.success){
          currentRegId=regId;
          document.getElementById('otp-hint').textContent='OTP sent to '+res.maskedEmail+'. Valid for 10 minutes.';
          goStep(2);
        } else { showError(res.message||'Failed to send OTP.'); }
      }catch{ showError('Connection error. Please try again.'); }
      finally{ document.getElementById('send-otp-text').textContent='Send OTP to Leader\'s Email'; document.getElementById('send-otp-spin').classList.add('hidden'); document.getElementById('btn-send-otp').disabled=false; }
    });

    document.getElementById('btn-verify-otp').addEventListener('click', ()=>{
      const otp = document.getElementById('otp-input').value.trim();
      if(otp.length!==6||!/^\d+$/.test(otp)){ showError('Enter a valid 6-digit OTP.'); return; }
      // OTP will be verified server-side on reset — just move to step 3
      verifiedOtp=otp;
      goStep(3);
    });

    document.getElementById('btn-reset-pwd').addEventListener('click', async()=>{
      const newPwd=document.getElementById('new-pwd').value;
      const confPwd=document.getElementById('confirm-pwd').value;
      if(newPwd.length<6){ showError('Password must be at least 6 characters.'); return; }
      if(newPwd!==confPwd){ showError('Passwords do not match.'); return; }
      hideAlerts();
      document.getElementById('reset-pwd-text').textContent='Resetting...';
      document.getElementById('reset-pwd-spin').classList.remove('hidden');
      document.getElementById('btn-reset-pwd').disabled=true;
      try{
        const res=await PortalApi.resetPassword(currentRegId,verifiedOtp,newPwd);
        if(res.success){
          showSuccess('✅ Password reset successfully! Redirecting to login...');
          setTimeout(()=>window.location.href='portal.html',1800);
        } else { showError(res.message||'Reset failed.'); }
      }catch{ showError('Connection error. Please try again.'); }
      finally{ document.getElementById('reset-pwd-text').textContent='Reset Password'; document.getElementById('reset-pwd-spin').classList.add('hidden'); document.getElementById('btn-reset-pwd').disabled=false; }
    });
  </script>
</body>
</html>
